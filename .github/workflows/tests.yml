name: Tests

# Run the checks every time code is pushed or a pull request is opened
# (this includes pushes and pull requests to main)
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fastapi and httpx are for the API tests (osmnx and the Norwich
      # road-map data file are not needed: the tests use a tiny map)
      - name: Install test dependencies
        run: pip install pytest fastapi httpx pyyaml

      - name: Run the tests
        run: python -m pytest backend/tests -v

  # The same tests on Python 3.9, the version used for local development.
  test-python-3-9:
    name: test (Python 3.9)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install test dependencies
        run: pip install pytest fastapi httpx pyyaml

      - name: Run the tests
        run: python -m pytest backend/tests -v

  # Check the React/TypeScript front end: install exactly what
  # package-lock.json says, lint it, build it and run its tests.
  frontend:
    name: frontend (lint, build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

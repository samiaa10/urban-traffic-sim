name: Tests

# Run the checks every time code is pushed or a pull request is opened
# (this includes pushes and pull requests to main)
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A real PostgreSQL for the database tests (backend/tests/db): they
    # check the migrations, the constraints and that saved runs survive a
    # restart, which only a real PostgreSQL can show
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norwich
          POSTGRES_PASSWORD: norwich
          POSTGRES_DB: norwich_sim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norwich -d norwich_sim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://norwich:norwich@localhost:5432/norwich_sim_test
      # Fail, rather than skip, if the database tests cannot run
      REQUIRE_DATABASE_TESTS: "1"

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # fastapi and httpx are for the API tests, pyyaml for the deployment
      # file tests, sqlalchemy/alembic/psycopg for the database (osmnx and
      # the Norwich road-map data file are not needed: tests use tiny maps)
      - name: Install test dependencies
        run: pip install pytest fastapi httpx pyyaml "numpy>=2" "sqlalchemy>=2.0,<2.1" "alembic>=1.13,<2" "psycopg[binary]>=3.2,<4"

      # The migrations apply to an empty database, and the models match
      # them (nothing left for autogenerate to find)
      - name: Check the database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check

      - name: Run the tests
        run: python -m pytest backend/tests -v -rs

  # The same tests on Python 3.12, the version the Render deployment and
  # the Docker image use. Python 3.9 was dropped: it is past end of life
  # and is not available on the ubuntu-latest (26.04) runners.
  test-python-3-12:
    name: test (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: norwich
          POSTGRES_PASSWORD: norwich
          POSTGRES_DB: norwich_sim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U norwich -d norwich_sim_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://norwich:norwich@localhost:5432/norwich_sim_test
      REQUIRE_DATABASE_TESTS: "1"

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest fastapi httpx pyyaml "numpy>=2" "sqlalchemy>=2.0,<2.1" "alembic>=1.13,<2" "psycopg[binary]>=3.2,<4"

      - name: Check the database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic check

      - name: Run the tests
        run: python -m pytest backend/tests -v -rs

  # Check the React/TypeScript front end: install exactly what
  # package-lock.json says, lint it, build it and run its tests.
  frontend:
    name: frontend (lint, build and test)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from the lockfile
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Node's built-in test runner: helpers, requests, result tables
      - name: Logic tests
        run: npm run test:unit

      # Vitest + jsdom + React Testing Library: render the real App and
      # click through it (type-checked first)
      - name: Interaction tests
        run: npm run test:ui

  # Build both Docker images and run the whole application with Docker
  # Compose (PostgreSQL, migrations, backend, nginx + frontend), then
  # check it end to end through nginx, including that saved runs and
  # optimiser results survive a backend restart
  # (scripts/compose_smoke_test.py; it also runs locally).
  docker:
    name: docker (build and run with Compose)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Check the Compose file
        run: docker compose config --quiet

      - name: Build, start and check the stack
        run: python3 scripts/compose_smoke_test.py

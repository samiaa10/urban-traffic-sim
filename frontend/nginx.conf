# nginx for the frontend image (frontend/Dockerfile)
#
#   /api/...  -> the backend container, with /api removed
#               (/api/simulation/step -> http://backend:8000/simulation/step),
#               its address looked up again if the container restarts
#   /assets/  -> the built JavaScript and CSS (file names change with
#               every build, so they can be cached for a long time)
#   anything else -> the app itself (index.html)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's own DNS. With the backend's address in a variable, nginx
    # looks it up again (every 10 s) instead of once at start-up, so a
    # restarted backend container with a new IP is still found, and nginx
    # starts even if the backend is not up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $backend http://backend:8000;

        # /api/simulation/step -> /simulation/step (the query string is kept)
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The optimiser can take a while on the full map
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, or a new build would not show up
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

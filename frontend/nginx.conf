# nginx for the frontend image (frontend/Dockerfile)
#
#   /api/...  -> the backend container, with /api removed
#               (/api/simulation/step -> http://backend:8000/simulation/step)
#   /assets/  -> the built JavaScript and CSS (file names change with
#               every build, so they can be cached for a long time)
#   anything else -> the app itself (index.html)

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # The trailing slash removes the /api prefix
        proxy_pass http://backend:8000/;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The optimiser can take a while on the full map
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must not be cached, or a new build would not show up
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

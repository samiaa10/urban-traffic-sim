# Render Blueprint: creates the database and both services from this
# repository. Step-by-step instructions are in the README ("Deploying to
# Render").

databases:
  # ---- PostgreSQL: saved runs, histories and scenario studies ----
  # Render's free database expires 30 days after it is created (and is
  # deleted 14 days later unless upgraded); it has 1 GB and no backups.
  # Without it the API still works, keeping runs in memory only.
  - name: norwich-sim-db
    plan: free
    databaseName: norwich_sim
    user: norwich

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: norwich-sim-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    # Bring the database up to date, then start. Render tells the app
    # which port to use through $PORT. (Free services cannot have a
    # separate pre-deploy step, so the migration runs here; it does
    # nothing when the database is already up to date.) The API logs each
    # request itself (backend/api/protection.py), so uvicorn's own access
    # log is off.
    startCommand: alembic upgrade head && uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT --no-access-log
    # Answers 200 as long as the process is up (/ready also checks the
    # database, but a database outage should not restart the API: it keeps
    # simulating, just without saving)
    healthCheckPath: /health
    # Deploy a new commit only once its GitHub Actions checks have passed
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # The database above (Render's internal address)
      - key: DATABASE_URL
        fromDatabase:
          name: norwich-sim-db
          property: connectionString
      # Scenario studies run one at a time inside the API process: the
      # free service has 512 MB, too little for worker processes
      - key: SCENARIO_WORKERS
        value: "0"
      # The frontend's address, for example https://norwich-sim.onrender.com
      # Render asks for this when the Blueprint is created.
      - key: CORS_ORIGINS
        sync: false
      # Requests reach the API through Render's proxy: the visitor's
      # address is the first in X-Forwarded-For (used for rate limits)
      - key: TRUST_PROXY
        value: "true"
      # Expensive requests (starting runs, fleets, the optimiser, studies)
      # per visitor per minute; cheap ones (stepping, status) are unlimited
      - key: RATE_LIMIT_PER_MINUTE
        value: "30"
      # Runs nobody has touched for this long are stopped
      - key: RUN_IDLE_MINUTES
        value: "30"
      - key: LOG_FORMAT
        value: json
      # Optional: the AI City Analyst's model (docs/AI.md). Render asks for the
      # value; nothing is stored here. Left empty, the analyst uses its
      # built-in rules.
      - key: ANTHROPIC_API_KEY
        sync: false

  # ---- Frontend: React + Vite, built to static files ----
  - type: web
    name: norwich-sim
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: checksPass
    # The same security headers the Docker nginx sends
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The backend's address, for example https://norwich-sim-api.onrender.com
      # Render asks for this when the Blueprint is created.
      - key: VITE_API_URL
        sync: false

# Render Blueprint: creates the database and both services from this
# repository. Step-by-step instructions are in the README ("Deploying to
# Render").

databases:
  # ---- PostgreSQL: saved runs, histories and scenario studies ----
  # Render's free database expires 30 days after it is created (and is
  # deleted 14 days later unless upgraded); it has 1 GB and no backups.
  # Without it the API still works, keeping runs in memory only.
  - name: norwich-sim-db
    plan: free
    databaseName: norwich_sim
    user: norwich

services:
  # ---- Backend: FastAPI ----
  - type: web
    name: norwich-sim-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-deploy.txt
    # Bring the database up to date, then start. Render tells the app
    # which port to use through $PORT. (Free services cannot have a
    # separate pre-deploy step, so the migration runs here; it does
    # nothing when the database is already up to date.)
    startCommand: alembic upgrade head && uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      # The database above (Render's internal address)
      - key: DATABASE_URL
        fromDatabase:
          name: norwich-sim-db
          property: connectionString
      # Scenario studies run one at a time inside the API process: the
      # free service has 512 MB, too little for worker processes
      - key: SCENARIO_WORKERS
        value: "0"
      # The frontend's address, for example https://norwich-sim.onrender.com
      # Render asks for this when the Blueprint is created.
      - key: CORS_ORIGINS
        sync: false

  # ---- Frontend: React + Vite, built to static files ----
  - type: web
    name: norwich-sim
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      # The backend's address, for example https://norwich-sim-api.onrender.com
      # Render asks for this when the Blueprint is created.
      - key: VITE_API_URL
        sync: false
